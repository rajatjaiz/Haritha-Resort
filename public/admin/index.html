<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haritha Admin</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/style.css">
<style>body{padding-bottom:0}main{max-width:1100px}.top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.top button{background:var(--c);color:var(--t);border:1px solid var(--b)}.top button.on{background:var(--g);color:#fff}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.k{border-left:6px solid var(--a)}.k.preparing{border-color:#3b82f6}.k.ready{border-color:#16a34a}.k.rq{border-color:var(--r)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.row button{padding:6px 10px;font-size:14px}.bar{height:14px;background:var(--g);border-radius:4px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.qrc{text-align:center;border:1px dashed var(--b);padding:12px;border-radius:12px;break-inside:avoid}.qrc div.q{display:flex;justify-content:center}
@media print{header,.top,.noprint{display:none!important}body{background:#fff;color:#000}}</style></head>
<body><header><img src="/logo.png" onerror="this.onerror=null;this.src='/logo.svg'" alt=""><div><h1>Haritha Beach Resort · Admin</h1><small id="live">Staff portal</small></div><button class="alt" style="margin-left:auto" id="snd">🔔 Sound on</button></header>
<main id="m"></main>
<script src="/admin/admin.js"></script></body></html>
